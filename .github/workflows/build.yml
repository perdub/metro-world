name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: metro-world-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: bash ./gradlew --no-daemon test build
      - name: Prepare fixed filename
        run: cp "$(find build/libs -maxdepth 1 -type f -name 'metro-world-*.jar' ! -name '*-sources.jar' -print -quit)" build/libs/metro-world.jar
      - name: Add mod to server image context
        run: install -D -m 0644 build/libs/metro-world.jar server/mods/metro-world.jar
      - uses: actions/upload-artifact@v4
        with:
          name: metro-world
          path: build/libs/metro-world.jar
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Container image metadata
        id: image-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/metro-world
          tags: |
            type=raw,value=dev-latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - name: Build and publish server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.image-meta.outputs.tags }}
          labels: ${{ steps.image-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Rolling release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view rolling || gh release create rolling --title "Latest development build" --prerelease --notes "Automatic build from main."
          gh release upload rolling build/libs/metro-world.jar --clobber
      - name: Versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/libs/metro-world.jar --generate-notes
