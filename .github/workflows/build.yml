name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: metro-world-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install model importer test dependencies
        run: python3 -m pip install -r scripts/train-model-requirements.txt
      - name: Check train controller and geometry
        run: bash scripts/check-trains.sh
      - name: Check discrete rail connectivity
        run: bash scripts/check-rail-geometry.sh
      - run: bash ./gradlew --no-daemon test build
      - name: Prepare fixed filename
        run: cp "$(find build/libs -maxdepth 1 -type f -name 'metro-world-*.jar' ! -name '*-sources.jar' -print -quit)" build/libs/metro-world.jar
      - name: Add mod to server image context
        run: install -D -m 0644 build/libs/metro-world.jar server/mods/metro-world.jar
      - name: Bundle Fabric API and server optimization mods
        run: python3 scripts/prepare-server-mods.py
      - uses: actions/upload-artifact@v4
        with:
          name: metro-world
          path: build/libs/metro-world.jar
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Container image metadata
        id: image-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/metro-world
          tags: |
            type=raw,value=dev-latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - name: Build testable server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: metro-world:ci
          labels: ${{ steps.image-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check container test orchestration
        run: python3 -m unittest discover -s scripts/tests
      - name: Test Minecraft container
        run: bash scripts/container-smoke-test.sh metro-world:ci
      - name: Upload container diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-diagnostics
          path: build/container-check/
          if-no-files-found: ignore
      - name: Export tested container
        run: docker save metro-world:ci | gzip > build/metro-world-container.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: metro-world-container
          path: build/metro-world-container.tar.gz
          compression-level: 0
      - name: Publish tested server image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          IMAGE_TAGS: ${{ steps.image-meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker tag metro-world:ci "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
      - name: Rolling release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view rolling || gh release create rolling --title "Latest development build" --prerelease --notes "Automatic build from main."
          gh release upload rolling build/libs/metro-world.jar --clobber
      - name: Versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/libs/metro-world.jar --generate-notes
