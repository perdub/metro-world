services:
  minecraft:
    image: ${METRO_WORLD_IMAGE:?Set METRO_WORLD_IMAGE in .env to the published GHCR image}
    ports:
      - "${METRO_WORLD_PORT:-25565}:25565"
    environment:
      EULA: "${EULA:-FALSE}"
      LEVEL: "${METRO_WORLD_LEVEL:-btr-test}"
    volumes:
      - metro-world-world:/data
    stdin_open: true
    tty: true
    restart: unless-stopped
volumes:
  metro-world-world:
    name: ${METRO_WORLD_VOLUME_NAME:-btr-infrastructure_btr-world}
