plugins { id 'fabric-loom' version '1.8.13'; id 'maven-publish' }
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories { maven { url = 'https://maven.nucleoid.xyz/' }; maven { url = 'https://api.modrinth.com/maven' } }
dependencies {
 minecraft 'com.mojang:minecraft:1.21.1'
 mappings 'net.fabricmc:yarn:1.21.1+build.3:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.16.10'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.1+1.21.1'
 modImplementation 'eu.pb4:polymer-core:0.9.19+1.21.1'
 include 'eu.pb4:polymer-core:0.9.19+1.21.1'
 include 'eu.pb4:polymer-common:0.9.19+1.21.1'
 testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
 testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 21 }
test { useJUnitPlatform() }
